# Nevatch Server __VERSION__. Settings go in .env next to this file (copy .env.example to .env), then:
#   docker compose up -d --build
#   docker compose logs -f        (shows the console password the first time, if you didn't set ADMIN_PASSWORD)
services:
  nevatch:
    build: .
    image: nevatch-server:__VERSION__
    container_name: nevatch
    restart: unless-stopped
    # A small init as PID 1: passes stop signals on to Node and cleans up finished ping/xray child processes.
    init: true
    # Every VPN connection uses a few open files (more with the speed limit on); the default 1024 can run out.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Keeps the server log from growing forever: at most 3 files of 10 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      VPN_PORT: ${VPN_PORT:-443}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      # The VPN port: the same number on both sides, because it also goes into everyone's key.
      - "${VPN_PORT:-443}:${VPN_PORT:-443}/tcp"
      # The web console. Never forward this one on your router. Use 127.0.0.1 here to allow only this machine.
      - "${CONSOLE_BIND:-0.0.0.0}:${CONSOLE_PORT:-8088}:8088/tcp"
    volumes:
      # Keys, people and the console password. Back it up; losing it means everyone needs a new key.
      - ./data:/data
